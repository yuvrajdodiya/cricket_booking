<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User List</title>
    <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background:
        linear-gradient(135deg, rgba(15, 23, 42, 0.92), rgba(37, 99, 235, 0.75)),
        url('https://images.unsplash.com/photo-1518091043644-c1d4457512c6?auto=format&fit=crop&w=1600&q=80') center/cover fixed;
      color: #fff;
    }

    /* Navbar */
    .navbar {
      width: 100%;
      padding: 18px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.15);
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .brand {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 1px;
      color: #ffffff;
    }

    .nav-links {
      display: flex;
      gap: 14px;
      list-style: none;
      flex-wrap: wrap;
    }

    .nav-links a {
      text-decoration: none;
      color: #e5e7eb;
      font-weight: 600;
      padding: 10px 18px;
      border-radius: 999px;
      transition: 0.3s ease;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .nav-links a:hover {
      background: #ffffff;
      color: #0f172a;
      transform: translateY(-2px);
    }

    /* Main */
    .main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 50px 20px;
    }

    .card {
      width: 100%;
      max-width: 900px;
      padding: 50px 35px;
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.25);
      text-align: center;
    }

    .card h1 {
      font-size: 42px;
      margin-bottom: 14px;
    }

    .card p {
      font-size: 18px;
      color: #e5e7eb;
      line-height: 1.7;
      max-width: 700px;
      margin: 0 auto;
    }

    .stats {
      margin-top: 35px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }

    .stat-box {
      padding: 22px 16px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.10);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .stat-box h3 {
      font-size: 26px;
      margin-bottom: 8px;
      color: #ffffff;
    }

    .stat-box span {
      font-size: 15px;
      color: #dbeafe;
    }

    /* Footer */
    .footer {
      padding: 22px 40px;
      background: rgba(15, 23, 42, 0.92);
      border-top: 1px solid rgba(255, 255, 255, 0.12);
    }

    .footer-wrap {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .footer-info p {
      margin-bottom: 6px;
      font-size: 15px;
      color: #e5e7eb;
    }

    .footer-info a {
      color: #93c5fd;
      text-decoration: none;
    }

    .footer-info a:hover {
      text-decoration: underline;
    }

    .socials {
      display: flex;
      gap: 12px;
    }

    .socials a {
      width: 44px;
      height: 44px;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      border-radius: 50%;
      color: white;
      text-decoration: none;
      font-size: 18px;
      background: rgba(255, 255, 255, 0.10);
      border: 1px solid rgba(255, 255, 255, 0.14);
      transition: 0.3s ease;
    }

    .socials a:hover {
      transform: translateY(-4px);
      background: #2563eb;
    }
   .stats {
        grid-template-columns: 1fr;
      }

      .footer-wrap {
        flex-direction: column;
        text-align: center;
      }
    
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: linear-gradient(rgba(15, 35, 80, 0.75), rgba(15, 35, 80, 0.75)),
                        url("your-background-image.jpg");
            background-size: cover;
            background-position: center;
            min-height: 100vh;
            color: white;
        }
        

        .topbar {
            background: rgba(255, 255, 255, 0.10);
            backdrop-filter: blur(10px);
            padding: 18px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.15);
        }

        .topbar h1 {
            font-size: 28px;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 60px auto;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
        }

        .container h2 {
            text-align: center;
            margin-bottom: 25px;
            font-size: 32px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            overflow: hidden;
            border-radius: 15px;
        }

        thead {
            background: rgba(255, 255, 255, 0.18);
        }

        th, td {
            padding: 16px 14px;
            text-align: left;
            font-size: 16px;
        }

        tbody tr {
            background: rgba(255, 255, 255, 0.08);
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }

        tbody tr:hover {
            background: rgba(255, 255, 255, 0.14);
        }

        .badge {
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            display: inline-block;
        }

        .yes {
            background: #28c76f;
            color: white;
        }

        .no {
            background: #ff4d4d;
            color: white;
        }

        @media (max-width: 768px) {
            .container {
                width: 95%;
                padding: 18px;
            }

            table, thead, tbody, th, td, tr {
                font-size: 14px;
            }

            th, td {
                padding: 12px 10px;
            }
        }
    </style>
</head>
<body>

  <nav class="navbar">
    <div class="brand">Admin Dashboard</div>
    <ul class="nav-links">
      <from method="POST">
        <li><a href="{% url 'admin_dashboard' %}">BACK</a></li>
      </from>
    </ul>
  </nav>

    <div class="container">
        <h2>User Details</h2>

        <table>
            <thead>
                <tr>
                    <th>Username</th>
                    <th>Email Address</th>
                    <th>Staff Status</th>
                </tr>
            </thead>
            <tbody>
                {% for user in users %}
                <tr>
                    <td>{{ user.username }}</td>
                    <td>{{ user.email }}</td>
                    <td>
                        {% if user.is_staff %}
                            <span class="badge yes">Yes</span>
                        {% else %}
                            <span class="badge no">No</span>
                        {% endif %}
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

</body>
</html>
